sonar.projectKey=willphamsg1_madt-gui
sonar.organization=willphamsg1

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=madt_gui
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file.
sonar.sources=src
sonar.exclusions=**/*.spec.ts,test/**

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Unit test coverage. Generated by karma-coverage's lcovonly reporter
# (see karma.conf.js -> coverageReporter) as part of the CI "test" job.
sonar.javascript.lcov.reportPaths=coverage/madt/lcov.info
sonar.typescript.lcov.reportPaths=coverage/madt/lcov.info
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
