<div class="select-boarding-type">
    <button type="button" class="back-button" (click)="handleButtonSound(); handleBack()">
        {{ 'BACK' | translate }}
    </button>
    <div>
        <h2 class="title">{{ 'SET_SV_ENTRY_EXIT' | translate }}</h2>
        <div class="content">
            <button
                type="button"
                class="row"
                [ngClass]="{ selected: cvType === 1 }"
                (click)="handleButtonSound(); handleSelectType(1)"
            >
                <p class="label">{{ 'SET_ALL_TO_AUTO' | translate }}</p>
            </button>
            <button
                type="button"
                class="row"
                [ngClass]="{ selected: cvType === 2 }"
                (click)="handleButtonSound(); handleSelectType(2)"
            >
                <p class="label">{{ 'SET_ALL_TO_EXIT' | translate }}</p>
            </button>
            <button
                type="button"
                class="row"
                [ngClass]="{ selected: cvType === 3 }"
                (click)="handleButtonSound(); handleSelectType(3)"
            >
                <p class="label">{{ 'SET_ALL_TO_NORMAL' | translate }}</p>
            </button>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-cancel" (click)="handleButtonSound(); handleSubmitType(false)">
            <img src="/assets/images/icons/main/close.svg" alt="" />
            <span>{{ 'CANCEL' | translate }}</span>
        </button>
        <button class="btn btn-confirm" (click)="handleButtonSound(); handleSubmitType(true)">
            <img src="/assets/images/icons/main/confirm.svg" alt="" />
            <span>{{ 'CONFIRM' | translate }}</span>
        </button>
    </div>
</div>
