<div class="inspector-ticket">
    <button type="button" class="back-button" (click)="handleButtonSound(); goBack()">Back</button>
    <div>
        <h2 class="title">Print Inspector Ticket</h2>
        <div class="content">
            <p class="label">
                Press the “Print Inspector Ticket” <br />
                button to Print.
            </p>
            <div class="btn-group">
                <button class="button" (click)="handleButtonSound(); handlePrint()">
                    <img src="/assets/images/icons/main/confirm.svg" alt="" />
                    <div class="text">Print Inspector Ticket</div>
                </button>
            </div>
        </div>
    </div>
</div>
