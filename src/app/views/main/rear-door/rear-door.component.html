<div class="toggle-cv-container">
    <div class="dialog">
        <div class="dialog-header">
            <p [innerHTML]="'TOGGLE_REAR_DOORS' | translate"></p>
        </div>
        <p class="confirm-msg">{{ 'PRESS_THE_BTN_TO_PROCEED' | translate }}</p>
        <div class="cf-btn-group">
            <button class="btn btn-cancel" (click)="handleButtonSound(); goBack()">
                <img src="/assets/images/icons/main/close.svg" alt="" />
                <span>{{ 'CANCEL' | translate }}</span>
            </button>
            <button class="btn btn-confirm" (click)="handleButtonSound(); handleToggleRearDoors()">
                <img src="/assets/images/icons/main/confirm.svg" alt="" />
                <span>{{ 'CONFIRM' | translate }}</span>
            </button>
        </div>
    </div>
</div>
