<div class="complimentary-day">
    <button type="button" class="back-button" (click)="handleButtonSound(); goBack()">
        {{ 'BACK' | translate }}
    </button>
    <div>
        <h2 class="title">{{ 'SET_COMPLIMENTARY_DAYS' | translate }}</h2>
        <div class="content">
            <p class="label">
                {{ 'CURRENT_DAYS' | translate }}: <span class="value">{{ fareConsoleSetting.complimentaryDays }}</span>
            </p>
            <div class="input-group">
                <p>{{ 'INPUT_CURRENT_DAYS' | translate }}</p>
                <input
                    [attr.aria-label]="'INPUT_CURRENT_DAYS' | translate"
                    id="inputField"
                    [class.hasError]="hasInputError"
                />
                @if (hasInputError) {
                    <p class="error">
                        {{
                            'EXCEEDED_THE_MAXIMUM_DAYS'
                                | translate: { days: fareConsoleSetting.maximumcomplimentaryDays }
                        }}
                    </p>
                }
            </div>
        </div>

        <div class="keyboard">
            <custom-keyboard [layout]="'numeric'" (keyPress)="handleChangeInput($event)"></custom-keyboard>
        </div>
    </div>
</div>
