<div class="save-transaction-page">
    @if (saveTransaction.status === ResponseStatus.SUCCESS) {
        <common-pop-up
            [type]="'success'"
            [title]="'SUCCESS'"
            [message]="'TRANSACTION_FILE_SAVED'"
            [fullScreen]="true"
            [disableSound]="true"
            [isOk]="true"
            (ok)="handleClickOK()"
        >
        </common-pop-up>
    } @else if (saveTransaction.status === ResponseStatus.ERROR) {
        <common-pop-up
            [type]="'error'"
            [title]="'ERROR'"
            [message]="saveTransaction.message || 'SAVE_TRANSACTION_FAILED'"
            [fullScreen]="true"
            [disableSound]="true"
            [isOk]="true"
            (ok)="handleClickOK()"
        >
        </common-pop-up>
    } @else if (saveTransaction.status === ResponseStatus.PROGRESS) {
        <div class="loading">
            <img class="loader" src="/assets/images/svg/spinner.svg" alt="" />
            <div [innerHTML]="('SAVING_TRANSACTIONS' | translate) + '...'"></div>
        </div>
    } @else {
        <div>
            <h2 class="title">{{ 'SAVE_TRANSACTION' | translate }}</h2>
            <div class="content">
                <p [innerHTML]="'PRESS_SAVE_TRANSACTION_TO_BEGIN_SAVING' | translate"></p>
                <button type="button" class="button" (click)="handleButtonSound(); handleClickButton()">
                    <img src="/assets/images/icons/main/confirm.svg" alt="" />
                    <div class="text">{{ 'SAVE_TRANSACTION' | translate }}</div>
                </button>
            </div>
        </div>
    }
</div>
